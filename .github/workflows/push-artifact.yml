name: Push to GCP Artifact Registry

on:
  push:
    branches: [ "test" ]

jobs:
  push-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Test auth
      run: |
        gcloud auth list

    - name: Set GCP project
      run: |
        gcloud config set project knightguard-475210    

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

    - name: Pull nginx
      run: |
        docker pull nginx:latest

    - name: Tag image
      run: |
        docker tag nginx:latest asia-south1-docker.pkg.dev/knightguard-475210/docker-images/nginx-test:latest

    - name: Push image
      run: |
        docker push asia-south1-docker.pkg.dev/knightguard-475210/docker-images/nginx-test:latest
